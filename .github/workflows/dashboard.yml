name: Update Dashboard
on:
  schedule:
    - cron: '30 1 * * *'   # 7:30 PM CST primary
    - cron: '0 2 * * *'    # 8:00 PM CST backup if primary delayed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run dashboard update
        env:
          MOEGO_API: ${{ secrets.MOEGO_API_KEY }}
        run: python3 update_dashboard.py
      - name: Commit and push
        run: |
          git config user.email "dashboard@centralbark.com"
          git config user.name "Dashboard Bot"
          git add -A
          git diff --staged --quiet || git commit -m "dashboard update $(date)"
          git push
